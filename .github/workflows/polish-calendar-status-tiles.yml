name: Polish PillPlan calendar status tiles

on:
  push:
    branches:
      - style/calendar-status-polish-2026-08-31
    paths:
      - scripts/polish_calendar_status_tiles.py
      - .github/workflows/polish-calendar-status-tiles.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/calendar-status-polish-2026-08-31
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visual polish
        run: python scripts/polish_calendar_status_tiles.py
      - name: Verify polished palette
        run: |
          grep -q '.day-cell.tier-red{background:#c94a3b' index.html
          grep -q '.day-cell.unrated{background:#ece9e4' index.html
          grep -q '.day-ico{font-size:18px' index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refine calendar status colors and contrast
          file_pattern: index.html
