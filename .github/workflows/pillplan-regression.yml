name: PillPlan regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'pillplan-next/**'
      - '.github/workflows/pillplan-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pillplan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  report-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax
        run: node --check pillplan-next/core-v5.js
      - name: Backup import regression
        run: node pillplan-next/backup-import.tests.cjs
      - name: Medication report regression
        run: node pillplan-next/medication-report.tests.cjs
      - name: Release gate rejects failed and stale candidates
        run: node pillplan-next/release-status.tests.cjs


  browser-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save @playwright/test
          pip install pypdf
          npx playwright install --with-deps chromium
      - name: Run isolated browser E2E
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          npx playwright test pillplan-next/browser-regression.spec.cjs --reporter=line --workers=1
      - name: Production-to-candidate update and rollback on isolated origin
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx playwright test pillplan-next/release-update.spec.cjs --reporter=line --workers=1 --output=update-test-results

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pillplan-browser-evidence
          path: |
            test-results/
            update-test-results/
  release-status:
    if: always() && github.event.pull_request.number == 19
    needs: [report-regression, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current PR without writing to repository
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.pulls.get({...context.repo, pull_number: 19});
            require('fs').writeFileSync('release-pr-state.json', JSON.stringify({number:data.number,state:data.state,draft:data.draft,head:{sha:data.head.sha},base:{sha:data.base.sha}}));
      - name: Build commit-bound release gate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          REGRESSION_RESULT: ${{ needs.report-regression.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node pillplan-next/release-status.cjs
      - name: Preserve release state
        uses: actions/upload-artifact@v4
        with:
          name: pillplan-release-status-${{ github.event.pull_request.head.sha }}
          path: release-evidence/
