name: Fix PillPlan undo handler

on:
  push:
    branches:
      - fix/undo-click-handler-2026-08-31
    paths:
      - scripts/fix_undo_handler.py
      - .github/workflows/fix-undo-handler.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/undo-click-handler-2026-08-31
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply undo handler fix
        run: python scripts/fix_undo_handler.py
      - name: Verify single delegated click handler
        run: |
          grep -q 'root.onclick = function(e)' index.html
          ! grep -q 'root.addEventListener("click", function(e)' index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix duplicate root click handler causing undo toggle reversal
          file_pattern: index.html
