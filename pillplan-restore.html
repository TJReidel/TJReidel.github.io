<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>PillPlan Wiederherstellung</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ef;color:#1a1612;margin:0;padding:24px}.wrap{max-width:560px;margin:0 auto}.card{background:#fff;border:1px solid #e8e1d8;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}h1{font-size:28px;margin:0 0 8px;color:#2a7c74}.muted{color:#6d665f;line-height:1.5}.ok{color:#1f6f4a;font-weight:700}.warn{color:#a33a2b;font-weight:700}.meta{background:#f3efe9;border-radius:12px;padding:12px;line-height:1.5;margin-top:12px}input[type=file]{width:100%;font-size:16px;margin-top:8px}button{width:100%;min-height:54px;border:0;border-radius:14px;background:#2a7c74;color:#fff;font-size:17px;font-weight:700;margin-top:12px}button.secondary{background:#efe9e0;color:#1a1612}button:disabled{opacity:.45}.confirm{display:flex;gap:10px;align-items:flex-start;margin-top:14px;line-height:1.4}.confirm input{margin-top:3px}.hidden{display:none}</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>PillPlan Wiederherstellung</h1>
    <p class="muted">Importiert ausschließlich den PillPlan-Datensatz <strong>pillplan_v4</strong> aus einer zuvor erzeugten Sicherungsdatei. Vor dem Überschreiben wird der aktuell vorhandene Datensatz als Rollback-Kopie lokal gesichert.</p>
  </div>
  <div class="card">
    <label for="file"><strong>1. Sicherungsdatei auswählen</strong></label>
    <input id="file" type="file" accept="application/json,.json"/>
    <div id="status" class="muted" style="margin-top:12px">Noch keine Datei ausgewählt.</div>
    <div id="preview" class="meta hidden"></div>
  </div>
  <div class="card">
    <strong>2. Wiederherstellung bestätigen</strong>
    <label class="confirm"><input id="confirm" type="checkbox" disabled/><span>Ich habe die Vorschau geprüft und möchte den aktuellen PillPlan-Datensatz in diesem Browser durch die Sicherung ersetzen.</span></label>
    <button id="restore" disabled>Backup wiederherstellen</button>
    <button id="open" class="secondary hidden">PillPlan öffnen</button>
  </div>
</div>
<script>
(function(){
  const file=document.getElementById('file'),status=document.getElementById('status'),preview=document.getElementById('preview'),confirm=document.getElementById('confirm'),restore=document.getElementById('restore'),open=document.getElementById('open');
  let candidate=null;
  function fail(msg){candidate=null;status.innerHTML='<span class="warn">'+msg+'</span>';preview.classList.add('hidden');confirm.checked=false;confirm.disabled=true;restore.disabled=true;open.classList.add('hidden');}
  function validateOuter(data){
    if(!data||typeof data!=='object'||!data.localStorage||typeof data.localStorage!=='object') throw new Error('Keine gültige PillPlan-Sicherungsdatei.');
    const raw=data.localStorage.pillplan_v4;
    if(typeof raw!=='string'||!raw.trim()) throw new Error('Der Datensatz pillplan_v4 fehlt.');
    let state; try{state=JSON.parse(raw);}catch(e){throw new Error('pillplan_v4 ist beschädigt oder nicht lesbar.');}
    if(!state||typeof state!=='object'||!Array.isArray(state.meds)||!state.taken||typeof state.taken!=='object') throw new Error('Die Sicherung enthält keine vollständige PillPlan-Struktur.');
    return {raw,state,meta:data.meta||{}};
  }
  file.addEventListener('change',()=>{
    const f=file.files&&file.files[0]; if(!f){fail('Keine Datei ausgewählt.');return;}
    const r=new FileReader();
    r.onload=()=>{
      try{
        const parsed=JSON.parse(r.result),v=validateOuter(parsed),meds=v.state.meds.length,taken=Object.keys(v.state.taken).length;
        candidate=v;
        const names=v.state.meds.map(m=>m&&m.name?m.name:'Unbenannt').join(', ');
        status.innerHTML='<span class="ok">Sicherung geprüft – technisch gültig.</span>';
        preview.innerHTML='<strong>Gefundene Medikamente:</strong> '+meds+'<br><strong>Einnahme-Einträge:</strong> '+taken+'<br><strong>Medikamente:</strong> '+names+(v.meta.createdAt?'<br><strong>Backup erstellt:</strong> '+v.meta.createdAt:'');
        preview.classList.remove('hidden');confirm.disabled=false;restore.disabled=!confirm.checked;
      }catch(e){fail(e.message||'Sicherung konnte nicht geprüft werden.');}
    };
    r.onerror=()=>fail('Datei konnte nicht gelesen werden.');
    r.readAsText(f);
  });
  confirm.addEventListener('change',()=>{restore.disabled=!(candidate&&confirm.checked);});
  restore.addEventListener('click',()=>{
    if(!candidate||!confirm.checked)return;
    try{
      const existing=localStorage.getItem('pillplan_v4');
      if(existing!==null){
        const rollback={savedAt:new Date().toISOString(),value:existing};
        localStorage.setItem('pillplan_restore_previous',JSON.stringify(rollback));
      }
      localStorage.setItem('pillplan_v4',candidate.raw);
      const verify=localStorage.getItem('pillplan_v4');
      if(verify!==candidate.raw) throw new Error('Verifikation fehlgeschlagen.');
      status.innerHTML='<span class="ok">Wiederherstellung erfolgreich und verifiziert.</span>';
      restore.disabled=true;confirm.disabled=true;file.disabled=true;open.classList.remove('hidden');
    }catch(e){status.innerHTML='<span class="warn">Wiederherstellung fehlgeschlagen: '+String(e.message||e)+'</span>';}
  });
  open.addEventListener('click',()=>{location.href='/';});
})();
</script>
</body>
</html>
