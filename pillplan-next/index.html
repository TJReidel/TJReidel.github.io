<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a7c74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PillPlan">
<link rel="manifest" href="/pillplan-next/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>PillPlan Next</title>
<style>
:root{--cream:#f7f4ef;--ink:#1a1612;--muted:#736d67;--teal:#2a7c74;--tealbg:#e8f4f3;--red:#c94a3b;--yellow:#d7b46a;--card:#fff;--line:#e7e1d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 90px)}h1{margin:0 0 4px;color:var(--teal);font-size:30px}h2{font-size:20px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}.status{background:var(--teal);color:#fff;border-radius:22px;padding:18px;margin:12px 0 18px}.status strong{font-size:28px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.tabs button,.btn{border:0;border-radius:14px;padding:13px 12px;font-weight:700;font-size:15px}.tabs button.active,.btn.primary{background:var(--teal);color:#fff}.tabs button{background:#eee8df}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.dose{display:flex;align-items:center;gap:12px}.grow{flex:1}.name{font-weight:800;font-size:18px}.time{color:var(--muted)}.check{width:54px;height:54px;border-radius:14px;border:0;font-size:24px;background:#eee8df}.check.on{background:var(--teal);color:#fff}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.day{border-radius:11px;padding:8px 2px;text-align:center;background:#eee8df;font-size:12px}.day.green{background:var(--teal);color:#fff}.day.yellow{background:var(--yellow)}.day.red{background:var(--red);color:#fff}.actions{display:grid;gap:10px}.file{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.notice{background:#fff7e8;border:1px solid #ead5aa;padding:12px;border-radius:12px;font-size:13px}.ok{background:var(--tealbg);border:1px solid #c8e4e1;padding:12px;border-radius:12px;font-size:13px}.empty{text-align:center;padding:36px 12px;color:var(--muted)}
</style>
</head>
<body><div id="app"></div><script src="/pillplan-next/app.js"></script></body>
</html>
