rder-radius:14px;background:#fff;padding:13px 14px;margin:6px 0}.btn{width:100%;border:0;border-radius:15px;padding:14px;font-weight:800;margin-top:8px}.btn.primary{background:var(--teal2);color:white}.btn.secondary{background:#ece8e2;color:#2c2925}.info{background:var(--tealbg);border:1px solid #c8e4e1;border-radius:15px;padding:13px;color:#315f5a}.warn{background:#fff8e9;border:1px solid #ead4a1;border-radius:15px;padding:13px}.time-row{display:grid;grid-template-columns:1fr 52px;gap:8px;align-items:center}.time-remove{height:48px;border:0;border-radius:14px;background:#fff0ed;color:#bb4436;font-size:28px;font-weight:700}.time-remove:disabled{opacity:.35}.settings-row{padding:12px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.metric{display:flex;justify-content:space-between;margin-top:9px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,244,239,.97);border-top:1px solid #e8e1d8;padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav{border:0;background:transparent;font-size:12px;font-weight:800;color:#47423e}.nav-icon{font-size:25px;display:block;margin-bottom:2px}.nav.active{color:var(--teal2)}.empty{text-align:center;color:var(--muted);padding:34px 16px}.section-label{font-size:13px;letter-spacing:.12em;font-weight:800;color:#6d6761;margin:15px 2px 8px}.small{font-size:13px;color:var(--muted)}
